name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Build ──► Functional Tests (go test)
#       └──► Functional Tests (Docker)   [parallel with go test]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./cmd/...

  test:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run unit and functional tests
        run: |
          cp -r config tests/functional/
          go test -v ./...

      - name: Run MCP race checks
        run: go test -race ./internal/mcpserver/... ./cmd/mcp

      - name: Build MCP container
        run: docker build -f Dockerfile.mcp -t ctrail-mcp:test .

  test-docker:
    name: Functional Tests (Docker)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Run functional tests in Docker
        run: docker compose -f docker-compose.test.yml up --build --exit-code-from test
