name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Build ──► Functional Tests (go test)
#       └──► Functional Tests (Docker)   [parallel with go test]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Build
        run: go build -v ./cmd/server/main.go

  test:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Download dependencies
        run: go mod download

      - name: Run functional tests
        run: |
          cp -r config tests/functional/
          go test -v ./tests/functional/...

  test-docker:
    name: Functional Tests (Docker)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run functional tests in Docker
        run: docker compose -f docker-compose.test.yml up --build --exit-code-from test
